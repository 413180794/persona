<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" lang="en">
<title>Persona</title>
<style>
  .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-out infinite; }
  .chip { animation: float 7s ease-in-out infinite; }
  .c1 { animation-delay: -1.8s; } .c2 { animation-delay: -3.5s; } .c3 { animation-delay: -5.2s; }
  .halo { transform-origin: 176px 160px; animation: breathe 6s ease-in-out infinite; }
  @keyframes pulse { from { transform: scale(1); opacity: .9; } to { transform: scale(2.6); opacity: 0; } }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  @keyframes breathe { 0%, 100% { opacity: .75; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .pulse, .chip, .halo { animation: none; } }
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a1913"/><stop offset="1" stop-color="#0c0b0a"/></linearGradient>
  <radialGradient id="glow" cx="176" cy="160" r="260" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ee7c54" stop-opacity="0.3"/><stop offset="1" stop-color="#ee7c54" stop-opacity="0"/></radialGradient>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#ffc4a0" fill-opacity="0.06"/></pattern>
  <filter id="lift" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.5"/></filter>
  <image id="icon" width="200" height="200" href="data:image/jpeg;base64,"/>
  <clipPath id="iconMask"><rect width="200" height="200" rx="44.7"/></clipPath>
  <clipPath id="frame"><rect width="1280" height="320" rx="24"/></clipPath>
</defs>
<g clip-path="url(#frame)">
  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#dots)"/>
  <rect class="halo" width="1280" height="320" fill="url(#glow)"/>
  <rect x="76" y="60" width="200" height="200" rx="44.7" fill="#2a1913" filter="url(#lift)"/>
  <g transform="translate(76 60)" clip-path="url(#iconMask)"><use href="#icon"/></g>
  <rect x="76.5" y="60.5" width="199" height="199" rx="44.2" fill="none" stroke="#3b312a"/>
  <text x="330" y="176" font-family="Georgia, 'Times New Roman', serif" font-size="104" font-weight="700" letter-spacing="-1" fill="#f3ede4">Persona</text>
  <text x="334" y="232" font-family="Georgia, 'Times New Roman', serif" font-size="25" letter-spacing="0" fill="#a89c8f">Every computer you own, in your pocket.</text>
  <g class="chip c0"><rect x="842" y="40" width="402" height="50" rx="25.0" fill="#1d1915" fill-opacity="0.88" stroke="#3b312a"/><circle cx="872" cy="65.0" r="7" fill="#e2553a"/><circle class="pulse" cx="872" cy="65.0" r="7" fill="none" stroke="#e2553a" stroke-width="2"/><text x="892" y="72" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', sans-serif" font-size="20" font-weight="600" fill="#f3ede4">Needs you</text><text x="998" y="72" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', sans-serif" font-size="19" fill="#a89c8f">photo-sync · review plan</text></g><g class="chip c1"><rect x="876" y="104" width="316" height="50" rx="25.0" fill="#1d1915" fill-opacity="0.88" stroke="#3b312a"/><circle cx="906" cy="129.0" r="7" fill="#e0a33a"/><text x="926" y="136" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', sans-serif" font-size="20" font-weight="600" fill="#f3ede4">Working</text><text x="1016" y="136" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', sans-serif" font-size="19" fill="#a89c8f">weather · 5 tools</text></g><g class="chip c2"><rect x="812" y="168" width="376" height="50" rx="25.0" fill="#1d1915" fill-opacity="0.88" stroke="#3b312a"/><g transform="translate(828 179) scale(0.14)" clip-path="url(#iconMask)"><use href="#icon"/></g><text x="862" y="200" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', sans-serif" font-size="20" font-weight="600" fill="#f3ede4">Persona</text><text x="952" y="200" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', sans-serif" font-size="19" fill="#a89c8f">3 things need you today</text></g><g class="chip c3"><rect x="856" y="232" width="380" height="50" rx="25.0" fill="#1d1915" fill-opacity="0.88" stroke="#3b312a"/><circle cx="886" cy="257.0" r="7" fill="#3f9b62"/><text x="906" y="264" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', sans-serif" font-size="20" font-weight="600" fill="#f3ede4">Inbox</text><text x="975" y="264" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', sans-serif" font-size="19" fill="#a89c8f">AI twin drafted 2 replies</text></g>
  <rect x=".5" y=".5" width="1279" height="319" rx="24" fill="none" stroke="#3b312a"/>
</g>
</svg>

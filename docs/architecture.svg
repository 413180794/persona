<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" width="1100" height="620" role="img" aria-labelledby="title desc">
  <title id="title">Persona architecture</title>
  <desc id="desc">iPhone and Apple Watch connect to the hub over HTTPS and WebSocket. The hub runs on an always-on Linux machine and reaches your computers over SSH, where Claude Code and Codex run inside herdr. The hub also handles push notifications, mail and Lark.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; }
    .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    .bg { fill: #ffffff; }
    .panel { fill: #f6f8fa; stroke: #d8dee4; }
    .t { fill: #1f2328; }
    .m { fill: #59636e; }
    .faint { fill: #818b98; }
    .wire { stroke: #8c959f; }
    .wire-head { fill: #8c959f; }
    .phone { --c: #5b5bd6; }
    .hub { --c: #e8590c; }
    .pc { --c: #0f8a72; }
    .ext { --c: #8c959f; }
    .card { fill: var(--c); fill-opacity: .07; stroke: var(--c); stroke-opacity: .45; }
    .chip { fill: var(--c); fill-opacity: .12; }
    .chip-t { fill: var(--c); }
    .accent { fill: var(--c); }
    .tool { stroke: #5b5bd6; }
    .tool-head { fill: #5b5bd6; }
    .tool-t { fill: #5b5bd6; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .panel { fill: #151b23; stroke: #3d444d; }
      .t { fill: #f0f6fc; }
      .m { fill: #9198a1; }
      .faint { fill: #768390; }
      .wire { stroke: #656c76; }
      .wire-head { fill: #656c76; }
      .phone { --c: #8b8cf7; }
      .hub { --c: #ff8a4c; }
      .pc { --c: #3fc9a8; }
      .ext { --c: #8b949e; }
      .card { fill-opacity: .1; stroke-opacity: .55; }
      .chip { fill-opacity: .18; }
      .tool { stroke: #8b8cf7; }
      .tool-head { fill: #8b8cf7; }
      .tool-t { fill: #8b8cf7; }
    }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="wire-head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="tool-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="tool-head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1100" height="620" rx="16"/>

  <text class="t" x="550" y="42" font-size="20" font-weight="700" text-anchor="middle">Persona architecture</text>
  <text class="m" x="550" y="66" font-size="13" text-anchor="middle">The phone is the remote, the hub relays, and Claude Code keeps running on your own computers</text>

  <!-- iPhone & Watch -->
  <g class="phone">
    <rect class="panel" x="30" y="90" width="260" height="350" rx="14" stroke-width="1"/>
    <rect class="accent" x="50" y="106" width="4" height="34" rx="2"/>
    <text class="t" x="64" y="120" font-size="15" font-weight="700">Your iPhone and Watch</text>
    <text class="m" x="64" y="137" font-size="11.5">iOS 26 · watchOS 26</text>

    <rect class="card" x="50" y="152" width="220" height="118" rx="10" stroke-width="1"/>
    <text class="t" x="66" y="174" font-size="13.5" font-weight="600">Persona App</text>
    <text class="m" x="66" y="196" font-size="12"><tspan class="t" font-weight="600">Chat</tspan>&#160;&#160;AI assistant on the go</text>
    <text class="m" x="66" y="214" font-size="12"><tspan class="t" font-weight="600">Agents</tspan>&#160;&#160;command your Agents</text>
    <text class="m" x="66" y="232" font-size="12"><tspan class="t" font-weight="600">Inbox</tspan>&#160;&#160;Lark + mail, AI-triaged</text>
    <text class="m" x="66" y="250" font-size="12"><tspan class="t" font-weight="600">Siri</tspan>&#160;&#160;ask, approve via Shortcuts</text>

    <rect class="card" x="50" y="280" width="220" height="46" rx="10" stroke-width="1"/>
    <text class="t" x="66" y="299" font-size="13.5" font-weight="600">Apple Watch</text>
    <text class="m" x="66" y="316" font-size="11.5">Raise wrist to approve or answer</text>

    <rect class="card" x="50" y="336" width="220" height="80" rx="10" stroke-width="1"/>
    <text class="t" x="66" y="356" font-size="13.5" font-weight="600">On-phone data</text>
    <g font-size="10" text-anchor="middle">
      <rect class="chip" x="66" y="366" width="47" height="19" rx="9.5"/><text class="chip-t" x="89.5" y="379">Contacts</text>
      <rect class="chip" x="116" y="366" width="46" height="19" rx="9.5"/><text class="chip-t" x="139" y="379">Calendar</text>
      <rect class="chip" x="165" y="366" width="53" height="19" rx="9.5"/><text class="chip-t" x="191.5" y="379">Reminders</text>
      <rect class="chip" x="221" y="366" width="40" height="19" rx="9.5"/><text class="chip-t" x="241" y="379">Photos</text>
      <rect class="chip" x="66" y="390" width="40" height="19" rx="9.5"/><text class="chip-t" x="86" y="403">Health</text>
      <rect class="chip" x="109" y="390" width="48" height="19" rx="9.5"/><text class="chip-t" x="133" y="403">Location</text>
      <rect class="chip" x="160" y="390" width="53" height="19" rx="9.5"/><text class="chip-t" x="186.5" y="403">Clipboard</text>
      <rect class="chip" x="216" y="390" width="30" height="19" rx="9.5"/><text class="chip-t" x="231" y="403">…</text>
    </g>
  </g>

  <!-- hub -->
  <g class="hub">
    <rect class="panel" x="420" y="90" width="270" height="350" rx="14" stroke-width="1"/>
    <rect class="accent" x="440" y="106" width="4" height="34" rx="2"/>
    <text class="t" x="454" y="120" font-size="15" font-weight="700">hub <tspan class="m mono" font-size="12" font-weight="400">jarvisd hub</tspan></text>
    <text class="m" x="454" y="137" font-size="11.5">An always-on Linux machine</text>

    <rect class="card" x="440" y="152" width="230" height="46" rx="10" stroke-width="1"/>
    <text class="t" x="456" y="171" font-size="13.5" font-weight="600">Live channel</text>
    <text class="m" x="456" y="188" font-size="11.5">Chat and state changes pushed live</text>

    <rect class="card" x="440" y="206" width="230" height="46" rx="10" stroke-width="1"/>
    <text class="t" x="456" y="225" font-size="13.5" font-weight="600">Interaction queue</text>
    <text class="m" x="456" y="242" font-size="11.5">Questions, plan reviews, tool access</text>

    <rect class="card" x="440" y="260" width="230" height="46" rx="10" stroke-width="1"/>
    <text class="t" x="456" y="279" font-size="13.5" font-weight="600">Persona assistant</text>
    <text class="m" x="456" y="296" font-size="11.5">Headless Claude, memory, schedules</text>

    <rect class="card" x="440" y="314" width="230" height="46" rx="10" stroke-width="1"/>
    <text class="t" x="456" y="333" font-size="13.5" font-weight="600">Inbox</text>
    <text class="m" x="456" y="350" font-size="11.5">Lark messages and mail in one list</text>

    <rect class="card" x="440" y="368" width="230" height="46" rx="10" stroke-width="1"/>
    <text class="t" x="456" y="387" font-size="13.5" font-weight="600">Postgres</text>
    <text class="m" x="456" y="404" font-size="11.5">All state, mail credentials encrypted</text>
  </g>

  <!-- computers -->
  <g class="pc">
    <rect class="panel" x="820" y="90" width="250" height="350" rx="14" stroke-width="1"/>
    <rect class="accent" x="840" y="106" width="4" height="34" rx="2"/>
    <text class="t" x="854" y="120" font-size="15" font-weight="700">Your computers</text>
    <text class="m" x="854" y="137" font-size="11.5">Mac or Linux, hub connects via SSH</text>

    <rect class="card" x="840" y="152" width="210" height="170" rx="10" stroke-width="1"/>
    <text class="t" x="856" y="173" font-size="13.5" font-weight="600">On each computer</text>
    <g font-size="12" text-anchor="middle">
      <rect class="chip" x="856" y="184" width="178" height="28" rx="7"/>
      <text class="chip-t mono" x="945" y="202">jarvisd node</text>
      <line class="wire" x1="945" y1="213" x2="945" y2="225" stroke-width="1.5" marker-end="url(#head)"/>
      <rect class="chip" x="856" y="228" width="178" height="28" rx="7"/>
      <text class="chip-t" x="945" y="246">herdr</text>
      <line class="wire" x1="945" y1="257" x2="945" y2="269" stroke-width="1.5" marker-end="url(#head)"/>
      <rect class="chip" x="856" y="272" width="178" height="28" rx="7"/>
      <text class="chip-t" x="945" y="290">Claude Code · Codex</text>
    </g>
    <text class="m" x="945" y="314" font-size="11" text-anchor="middle">hooks, MCP route questions to phone</text>

    <rect class="card" x="840" y="332" width="210" height="40" rx="10" stroke-width="1" stroke-dasharray="4 3"/>
    <text class="m" x="945" y="357" font-size="12" text-anchor="middle">More computers …</text>

    <text class="faint" x="945" y="398" font-size="11" text-anchor="middle">No daemon needed:</text>
    <text class="faint" x="945" y="415" font-size="11" text-anchor="middle">hub starts node when it connects</text>
  </g>

  <!-- phone <-> hub -->
  <text class="t" x="355" y="192" font-size="12" font-weight="600" text-anchor="middle">HTTP + WebSocket</text>
  <line class="wire" x1="296" y1="204" x2="414" y2="204" stroke-width="1.5" marker-start="url(#head)" marker-end="url(#head)"/>
  <text class="m" x="355" y="222" font-size="11" text-anchor="middle">token auth</text>

  <text class="tool-t mono" x="355" y="282" font-size="11" text-anchor="middle">phone_* tools</text>
  <line class="tool" x1="414" y1="294" x2="296" y2="294" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#tool-head)"/>
  <text class="m" x="355" y="312" font-size="11" text-anchor="middle">run on the phone</text>

  <!-- hub <-> computers -->
  <text class="t" x="755" y="192" font-size="12" font-weight="600" text-anchor="middle">SSH</text>
  <line class="wire" x1="696" y1="204" x2="814" y2="204" stroke-width="1.5" marker-start="url(#head)" marker-end="url(#head)"/>
  <text class="m" x="755" y="222" font-size="11" text-anchor="middle">uses your ssh config</text>

  <text class="tool-t mono" x="755" y="282" font-size="11" text-anchor="middle">phone_* tools</text>
  <line class="tool" x1="814" y1="294" x2="696" y2="294" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#tool-head)"/>
  <text class="m" x="755" y="312" font-size="11" text-anchor="middle">called by Claude</text>

  <!-- hub -> external services -->
  <path class="wire" d="M555,446 V472 M355,472 H755" fill="none" stroke-width="1.5"/>
  <line class="wire" x1="355" y1="472" x2="355" y2="496" stroke-width="1.5" marker-end="url(#head)"/>
  <line class="wire" x1="555" y1="472" x2="555" y2="496" stroke-width="1.5" marker-end="url(#head)"/>
  <line class="wire" x1="755" y1="472" x2="755" y2="496" stroke-width="1.5" marker-end="url(#head)"/>

  <g class="ext">
    <rect class="card" x="265" y="500" width="180" height="52" rx="10" stroke-width="1"/>
    <text class="t" x="355" y="522" font-size="13" font-weight="600" text-anchor="middle">Apple Push (APNs)</text>
    <text class="m" x="355" y="540" font-size="11.5" text-anchor="middle">Alerts with the App closed</text>

    <rect class="card" x="465" y="500" width="180" height="52" rx="10" stroke-width="1"/>
    <text class="t" x="555" y="522" font-size="13" font-weight="600" text-anchor="middle">Your mail</text>
    <text class="m" x="555" y="540" font-size="11.5" text-anchor="middle">IMAP · SMTP · Gmail</text>

    <rect class="card" x="665" y="500" width="180" height="52" rx="10" stroke-width="1"/>
    <text class="t" x="755" y="522" font-size="13" font-weight="600" text-anchor="middle">Lark (optional)</text>
    <text class="m" x="755" y="540" font-size="11.5" text-anchor="middle">Messages via a Lark gateway</text>
  </g>
  <path class="wire" d="M265,526 H160 V448" fill="none" stroke-width="1.5" marker-end="url(#head)"/>

  <text class="faint" x="550" y="592" font-size="12" text-anchor="middle">The phone talks only to your own hub. Sit down at the computer, open herdr, and it is the same session as on the phone</text>
</svg>

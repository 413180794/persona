<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" width="1100" height="620" role="img" aria-labelledby="title desc">
  <title id="title">Jarvis 架构</title>
  <desc id="desc">iPhone 和 Apple Watch 通过 HTTPS 和 WebSocket 连到 hub；hub 跑在一台常开的 Linux 机器上，经 SSH 接入你的各台电脑，电脑上的 herdr 里运行 Claude Code 和 Codex。hub 还负责推送、邮箱和飞书。</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; }
    .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    .bg { fill: #ffffff; }
    .panel { fill: #f6f8fa; stroke: #d8dee4; }
    .t { fill: #1f2328; }
    .m { fill: #59636e; }
    .faint { fill: #818b98; }
    .wire { stroke: #8c959f; }
    .wire-head { fill: #8c959f; }
    .phone { --c: #5b5bd6; }
    .hub { --c: #e8590c; }
    .pc { --c: #0f8a72; }
    .ext { --c: #8c959f; }
    .card { fill: var(--c); fill-opacity: .07; stroke: var(--c); stroke-opacity: .45; }
    .chip { fill: var(--c); fill-opacity: .12; }
    .chip-t { fill: var(--c); }
    .accent { fill: var(--c); }
    .tool { stroke: #5b5bd6; }
    .tool-head { fill: #5b5bd6; }
    .tool-t { fill: #5b5bd6; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .panel { fill: #151b23; stroke: #3d444d; }
      .t { fill: #f0f6fc; }
      .m { fill: #9198a1; }
      .faint { fill: #768390; }
      .wire { stroke: #656c76; }
      .wire-head { fill: #656c76; }
      .phone { --c: #8b8cf7; }
      .hub { --c: #ff8a4c; }
      .pc { --c: #3fc9a8; }
      .ext { --c: #8b949e; }
      .card { fill-opacity: .1; stroke-opacity: .55; }
      .chip { fill-opacity: .18; }
      .tool { stroke: #8b8cf7; }
      .tool-head { fill: #8b8cf7; }
      .tool-t { fill: #8b8cf7; }
    }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="wire-head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="tool-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="tool-head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1100" height="620" rx="16"/>

  <text class="t" x="550" y="42" font-size="20" font-weight="700" text-anchor="middle">Jarvis 架构</text>
  <text class="m" x="550" y="66" font-size="13" text-anchor="middle">手机是遥控器，hub 负责中转，Claude Code 一直跑在你自己的电脑上</text>

  <!-- iPhone & Watch -->
  <g class="phone">
    <rect class="panel" x="30" y="90" width="260" height="350" rx="14" stroke-width="1"/>
    <rect class="accent" x="50" y="106" width="4" height="34" rx="2"/>
    <text class="t" x="64" y="120" font-size="15" font-weight="700">你的 iPhone 和手表</text>
    <text class="m" x="64" y="137" font-size="11.5">iOS 26 · watchOS 26</text>

    <rect class="card" x="50" y="152" width="220" height="118" rx="10" stroke-width="1"/>
    <text class="t" x="66" y="174" font-size="13.5" font-weight="600">Jarvis App</text>
    <text class="m" x="66" y="196" font-size="12"><tspan class="t" font-weight="600">对话</tspan>　随身的 AI 助手</text>
    <text class="m" x="66" y="214" font-size="12"><tspan class="t" font-weight="600">Agents</tspan>　指挥各台电脑上的 Agent</text>
    <text class="m" x="66" y="232" font-size="12"><tspan class="t" font-weight="600">收件箱</tspan>　飞书 + 邮件，AI 先分拣</text>
    <text class="m" x="66" y="250" font-size="12"><tspan class="t" font-weight="600">Siri</tspan>　快捷指令里问、批准</text>

    <rect class="card" x="50" y="280" width="220" height="46" rx="10" stroke-width="1"/>
    <text class="t" x="66" y="299" font-size="13.5" font-weight="600">Apple Watch</text>
    <text class="m" x="66" y="316" font-size="11.5">需要你的事：抬腕批准、回答</text>

    <rect class="card" x="50" y="336" width="220" height="80" rx="10" stroke-width="1"/>
    <text class="t" x="66" y="356" font-size="13.5" font-weight="600">手机本地数据</text>
    <g font-size="11" text-anchor="middle">
      <rect class="chip" x="66" y="366" width="48" height="19" rx="9.5"/><text class="chip-t" x="90" y="379">通讯录</text>
      <rect class="chip" x="120" y="366" width="38" height="19" rx="9.5"/><text class="chip-t" x="139" y="379">日历</text>
      <rect class="chip" x="164" y="366" width="38" height="19" rx="9.5"/><text class="chip-t" x="183" y="379">提醒</text>
      <rect class="chip" x="208" y="366" width="38" height="19" rx="9.5"/><text class="chip-t" x="227" y="379">照片</text>
      <rect class="chip" x="66" y="390" width="38" height="19" rx="9.5"/><text class="chip-t" x="85" y="403">健康</text>
      <rect class="chip" x="110" y="390" width="38" height="19" rx="9.5"/><text class="chip-t" x="129" y="403">位置</text>
      <rect class="chip" x="154" y="390" width="48" height="19" rx="9.5"/><text class="chip-t" x="178" y="403">剪贴板</text>
      <rect class="chip" x="208" y="390" width="38" height="19" rx="9.5"/><text class="chip-t" x="227" y="403">…</text>
    </g>
  </g>

  <!-- hub -->
  <g class="hub">
    <rect class="panel" x="420" y="90" width="270" height="350" rx="14" stroke-width="1"/>
    <rect class="accent" x="440" y="106" width="4" height="34" rx="2"/>
    <text class="t" x="454" y="120" font-size="15" font-weight="700">hub <tspan class="m mono" font-size="12" font-weight="400">jarvisd hub</tspan></text>
    <text class="m" x="454" y="137" font-size="11.5">一台常开的 Linux 机器</text>

    <rect class="card" x="440" y="152" width="230" height="46" rx="10" stroke-width="1"/>
    <text class="t" x="456" y="171" font-size="13.5" font-weight="600">实时通道</text>
    <text class="m" x="456" y="188" font-size="11.5">对话、状态变化即时推到手机</text>

    <rect class="card" x="440" y="206" width="230" height="46" rx="10" stroke-width="1"/>
    <text class="t" x="456" y="225" font-size="13.5" font-weight="600">交互队列</text>
    <text class="m" x="456" y="242" font-size="11.5">Agent 的提问、计划审批、工具权限</text>

    <rect class="card" x="440" y="260" width="230" height="46" rx="10" stroke-width="1"/>
    <text class="t" x="456" y="279" font-size="13.5" font-weight="600">Jarvis 助手</text>
    <text class="m" x="456" y="296" font-size="11.5">无头 Claude，带记忆和定时任务</text>

    <rect class="card" x="440" y="314" width="230" height="46" rx="10" stroke-width="1"/>
    <text class="t" x="456" y="333" font-size="13.5" font-weight="600">收件箱</text>
    <text class="m" x="456" y="350" font-size="11.5">飞书消息和邮件合成一个列表</text>

    <rect class="card" x="440" y="368" width="230" height="46" rx="10" stroke-width="1"/>
    <text class="t" x="456" y="387" font-size="13.5" font-weight="600">Postgres</text>
    <text class="m" x="456" y="404" font-size="11.5">全部状态；邮箱凭据加密保存</text>
  </g>

  <!-- computers -->
  <g class="pc">
    <rect class="panel" x="820" y="90" width="250" height="350" rx="14" stroke-width="1"/>
    <rect class="accent" x="840" y="106" width="4" height="34" rx="2"/>
    <text class="t" x="854" y="120" font-size="15" font-weight="700">你的各台电脑</text>
    <text class="m" x="854" y="137" font-size="11.5">Mac 或 Linux，hub 经 SSH 接入</text>

    <rect class="card" x="840" y="152" width="210" height="170" rx="10" stroke-width="1"/>
    <text class="t" x="856" y="173" font-size="13.5" font-weight="600">每台电脑上</text>
    <g font-size="12" text-anchor="middle">
      <rect class="chip" x="856" y="184" width="178" height="28" rx="7"/>
      <text class="chip-t mono" x="945" y="202">jarvisd node</text>
      <line class="wire" x1="945" y1="213" x2="945" y2="225" stroke-width="1.5" marker-end="url(#head)"/>
      <rect class="chip" x="856" y="228" width="178" height="28" rx="7"/>
      <text class="chip-t" x="945" y="246">herdr</text>
      <line class="wire" x1="945" y1="257" x2="945" y2="269" stroke-width="1.5" marker-end="url(#head)"/>
      <rect class="chip" x="856" y="272" width="178" height="28" rx="7"/>
      <text class="chip-t" x="945" y="290">Claude Code · Codex</text>
    </g>
    <text class="m" x="945" y="314" font-size="11" text-anchor="middle">hooks、MCP 把提问交给手机</text>

    <rect class="card" x="840" y="332" width="210" height="40" rx="10" stroke-width="1" stroke-dasharray="4 3"/>
    <text class="m" x="945" y="357" font-size="12" text-anchor="middle">更多电脑 …</text>

    <text class="faint" x="945" y="398" font-size="11" text-anchor="middle">不用常驻服务：</text>
    <text class="faint" x="945" y="415" font-size="11" text-anchor="middle">hub 连上时才启动 node</text>
  </g>

  <!-- phone <-> hub -->
  <text class="t" x="355" y="192" font-size="12" font-weight="600" text-anchor="middle">HTTP + WebSocket</text>
  <line class="wire" x1="296" y1="204" x2="414" y2="204" stroke-width="1.5" marker-start="url(#head)" marker-end="url(#head)"/>
  <text class="m" x="355" y="222" font-size="11" text-anchor="middle">token 鉴权</text>

  <text class="tool-t mono" x="355" y="282" font-size="11" text-anchor="middle">phone_* 工具</text>
  <line class="tool" x1="414" y1="294" x2="296" y2="294" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#tool-head)"/>
  <text class="m" x="355" y="312" font-size="11" text-anchor="middle">在手机本地执行</text>

  <!-- hub <-> computers -->
  <text class="t" x="755" y="192" font-size="12" font-weight="600" text-anchor="middle">SSH</text>
  <line class="wire" x1="696" y1="204" x2="814" y2="204" stroke-width="1.5" marker-start="url(#head)" marker-end="url(#head)"/>
  <text class="m" x="755" y="222" font-size="11" text-anchor="middle">复用你的 ssh 配置</text>

  <text class="tool-t mono" x="755" y="282" font-size="11" text-anchor="middle">phone_* 工具</text>
  <line class="tool" x1="814" y1="294" x2="696" y2="294" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#tool-head)"/>
  <text class="m" x="755" y="312" font-size="11" text-anchor="middle">Claude 发起调用</text>

  <!-- hub -> external services -->
  <path class="wire" d="M555,446 V472 M355,472 H755" fill="none" stroke-width="1.5"/>
  <line class="wire" x1="355" y1="472" x2="355" y2="496" stroke-width="1.5" marker-end="url(#head)"/>
  <line class="wire" x1="555" y1="472" x2="555" y2="496" stroke-width="1.5" marker-end="url(#head)"/>
  <line class="wire" x1="755" y1="472" x2="755" y2="496" stroke-width="1.5" marker-end="url(#head)"/>

  <g class="ext">
    <rect class="card" x="265" y="500" width="180" height="52" rx="10" stroke-width="1"/>
    <text class="t" x="355" y="522" font-size="13" font-weight="600" text-anchor="middle">Apple 推送（APNs）</text>
    <text class="m" x="355" y="540" font-size="11.5" text-anchor="middle">App 关着也能收到提醒</text>

    <rect class="card" x="465" y="500" width="180" height="52" rx="10" stroke-width="1"/>
    <text class="t" x="555" y="522" font-size="13" font-weight="600" text-anchor="middle">你的邮箱</text>
    <text class="m" x="555" y="540" font-size="11.5" text-anchor="middle">IMAP · SMTP · Gmail</text>

    <rect class="card" x="665" y="500" width="180" height="52" rx="10" stroke-width="1"/>
    <text class="t" x="755" y="522" font-size="13" font-weight="600" text-anchor="middle">飞书（可选）</text>
    <text class="m" x="755" y="540" font-size="11.5" text-anchor="middle">经飞书网关读取消息</text>
  </g>
  <path class="wire" d="M265,526 H160 V448" fill="none" stroke-width="1.5" marker-end="url(#head)"/>

  <text class="faint" x="550" y="592" font-size="12" text-anchor="middle">手机只和你自己的 hub 通信；坐到电脑前打开 herdr，就是手机上的同一个会话</text>
</svg>

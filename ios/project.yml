name: Jarvis
# Bundle id and team come from Config.xcconfig, generated from the personal config by scripts/jarvis_config.py
# (docs/config.md); this file and the Info.plists only say $(JARVIS_BUNDLE_ID).
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
options:
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"
  developmentLanguage: zh-Hans
  createIntermediateGroups: true
packages:
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    from: 2.4.1
  BeautifulUI:
    path: Packages/BeautifulUI
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
  configs:
    Debug:
      # The release machine's Swift gives up on expressions that dev machines still type-check (CLAUDE.md); warn early.
      OTHER_SWIFT_FLAGS: "$(inherited) -Xfrontend -warn-long-expression-type-checking=150"
    Release:
      # Anti-tampering basics: no symbols or reflection names in the shipped binary.
      STRIP_INSTALLED_PRODUCT: YES
      STRIP_STYLE: all
      DEPLOYMENT_POSTPROCESSING: YES
      DEAD_CODE_STRIPPING: YES
      SWIFT_REFLECTION_METADATA_LEVEL: without-names
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      SWIFT_COMPILATION_MODE: wholemodule
      SWIFT_OPTIMIZATION_LEVEL: -O
targets:
  Jarvis:
    type: application
    platform: iOS
    sources:
      - path: Jarvis
        excludes: ["**/*.md"]
      - path: Shared
      - path: LiveActivity
    dependencies:
      - target: JarvisWatch
      - target: JarvisWidgets
      - package: MarkdownUI
      - package: BeautifulUI
    entitlements:
      path: Jarvis/Resources/Jarvis.entitlements
      properties:
        aps-environment: development
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(JARVIS_BUNDLE_ID)
        PRODUCT_NAME: Jarvis
        # iPhone and iPad (2026-10-31: on iPad it ran as a phone-sized window). Wide layouts come from the size class
        # (SplitNavigation), as on an open iPhone Duo.
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
        # The commit stamp below reads the repository's .git, which the script sandbox does not let it see.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    # Which commit a build is (设置 › 关于 › 构建): stamped into the built Info.plist on every build, before signing;
    # "+" when the working tree had changes not committed.
    postBuildScripts:
      - name: Stamp the commit
        basedOnDependencyAnalysis: false
        # Its input, so it runs after the Info.plist is written (ran before it once, and the stamp was lost).
        inputFiles: ["$(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)"]
        script: |
          sha=$(git -C "$SRCROOT/.." rev-parse --short=8 HEAD 2>/dev/null || echo unknown)
          git -C "$SRCROOT/.." diff --quiet HEAD -- 2>/dev/null || sha="$sha+"
          plist="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
          /usr/libexec/PlistBuddy -c "Set :JarvisCommit $sha" "$plist" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :JarvisCommit string $sha" "$plist"
    info:
      path: Jarvis/Resources/Info.plist
      properties:
        CFBundleDisplayName: Jarvis
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes: [jarvis]
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.productivity
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # iPad: every orientation (Split View and Stage Manager need it).
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown,
                                                UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIBackgroundModes: [remote-notification]
        # The Fleet activity on the lock screen / Dynamic Island (docs/live-activity.md).
        NSSupportsLiveActivities: true
        # The hub is usually reached over plain HTTP inside a private network (docs/config.md).
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSCameraUsageDescription: "Jarvis uses the camera to scan the pairing QR code printed by `jarvisd hub pair`, for example when you first connect to your hub."
        NSContactsUsageDescription: "Jarvis lets Claude look up your contacts when you ask, for example to find a colleague's phone number or email before drafting a message."
        NSCalendarsFullAccessUsageDescription: "Jarvis lets Claude read and add calendar events when you ask, for example to check whether you are free on Friday afternoon or to book a meeting."
        NSCalendarsWriteOnlyAccessUsageDescription: "Jarvis adds events to your calendar when you ask Claude to, for example to save a meeting it scheduled for you."
        NSRemindersFullAccessUsageDescription: "Jarvis lets Claude read and create reminders when you ask, for example to add “review the PR” to your Today list."
        NSLocationWhenInUseUsageDescription: "Jarvis shares your current location with Claude only when you ask, for example to find what time it is where you are or which office you are in."
        NSHealthShareUsageDescription: "Jarvis lets Claude read health summaries when you ask, for example how many steps you walked this week or how long you slept last night."
        # Required by App Store processing whenever the HealthKit entitlement is present, even though Jarvis only reads.
        NSHealthUpdateUsageDescription: "Jarvis only reads health data and never writes it; if a future version saves data, for example a workout Claude logs for you, it will ask here first."
        NSPhotoLibraryUsageDescription: "Jarvis lets Claude look at recent photos when you ask, for example to read a screenshot you took or describe a whiteboard photo."
        NSPhotoLibraryAddUsageDescription: "Jarvis saves images Claude produces to your library when you ask, for example a chart it generated."
        NSMicrophoneUsageDescription: "Jarvis uses the microphone for voice input when you hold the mic button, for example to dictate a message to Claude while walking."
        NSSpeechRecognitionUsageDescription: "Jarvis turns your voice into text when you hold the mic button, for example to dictate a reply to Claude."
  # Draws the Fleet Live Activity. The app starts it and reports its tokens; the hub pushes its content.
  JarvisWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: JarvisWidgets
      - path: LiveActivity
      - path: Shared/FleetState.swift
      - path: Shared/StatusPalette.swift
      - path: Shared/Design/Palette.swift
    info:
      path: JarvisWidgets/Info.plist
      properties:
        CFBundleDisplayName: Jarvis
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: zh-Hans
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(JARVIS_BUNDLE_ID).liveactivity
        PRODUCT_NAME: JarvisWidgets
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        # Code shared with the app that must not call into it (the intents run in the app process).
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WIDGET_EXTENSION"
  JarvisWatch:
    type: application
    platform: watchOS
    sources:
      - path: JarvisWatch
      - path: Shared
    info:
      path: JarvisWatch/Info.plist
      properties:
        CFBundleDisplayName: Jarvis
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: zh-Hans
        WKApplication: true
        WKCompanionAppBundleIdentifier: $(JARVIS_BUNDLE_ID)
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(JARVIS_BUNDLE_ID).watchkitapp
        PRODUCT_NAME: Jarvis
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
  JarvisTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: JarvisTests
        excludes: ["*.json"] # TokenBaseline.json is read from the source tree, not the bundle
    dependencies:
      - target: Jarvis
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(JARVIS_BUNDLE_ID).tests
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Jarvis.app/Jarvis"
        BUNDLE_LOADER: "$(TEST_HOST)"
  # UI tests drive the real app in the simulator against the configured hub (scripts/ui-test.sh); not in the
  # default test run, which must work offline.
  JarvisUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: JarvisUITests
    dependencies:
      - target: Jarvis
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(JARVIS_BUNDLE_ID).uitests
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Jarvis
schemes:
  Jarvis:
    build:
      targets:
        Jarvis: all
        JarvisTests: [test]
        JarvisUITests: [test]
    run:
      config: Debug
    test:
      targets: [JarvisTests, JarvisUITests]
  JarvisWatch:
    build:
      targets:
        JarvisWatch: all
    run:
      config: Debug

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- The app icon (团子, apple/Persona/Resources/Assets.xcassets/AppIcon.appiconset): the paths of web MochiFace /
       apple PersonaFace in the icon's 1024 px coordinates; the dark disc when the system is dark. -->
  <style>
    .disc-top { stop-color: #f0e3d5 } .disc-bottom { stop-color: #d8c5b1 }
    .ink { fill: #1d1816 } .line { stroke: #1d1816 } .outline { stroke: #1d1816 }
    @media (prefers-color-scheme: dark) {
      .disc-top { stop-color: #332a26 } .disc-bottom { stop-color: #1d1816 }
      .line { stroke: #d6d1cd } .outline { stroke: #0e0b0a }
    }
  </style>
  <defs>
    <linearGradient id="d" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" class="disc-top"/><stop offset="1" class="disc-bottom"/>
    </linearGradient>
    <linearGradient id="b" gradientUnits="userSpaceOnUse" x1="400" y1="300" x2="500" y2="820">
      <stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#e9e3de"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="230" fill="url(#d)"/>
  <ellipse cx="490" cy="800" rx="265" ry="19" fill="#000" fill-opacity=".12"/>
  <path class="outline" fill="url(#b)" stroke-width="44" stroke-linejoin="round"
    d="M262 778C420 792 600 790 702 772C742 764 752 700 760 640C800 598 828 562 826 502C825 446 795 418 764 428C736 440 722 468 712 494C690 440 650 350 560 304C470 260 330 288 254 382C184 462 158 582 168 672C176 742 206 772 262 778Z"/>
  <ellipse cx="312" cy="556" rx="37" ry="33.3" fill="#f2703c"/>
  <circle class="ink" cx="397" cy="497" r="29"/>
  <circle class="ink" cx="553" cy="480" r="29"/>
  <path class="line" fill="none" stroke-width="36" stroke-linecap="round" d="M792 352L818 298M838 384L884 340M864 428L924 408"/>
</svg>

name: Persona
# Bundle id and team come from Config.xcconfig, generated from the personal config by scripts/jarvis_config.py
# (docs/config.md); this file and the Info.plists only say $(JARVIS_BUNDLE_ID).
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
options:
  deploymentTarget:
    iOS: "26.0"
    watchOS: "10.0"
    macOS: "26.0"
    visionOS: "26.0"
  developmentLanguage: zh-Hans
  createIntermediateGroups: true
packages:
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    from: 2.4.1
  BeautifulUI:
    path: Packages/BeautifulUI
  # The SSH tunnel to the hub (docs/network.md「经 SSH 隧道连 hub」): the iOS and Mac apps only, not the watch.
  PersonaSSH:
    path: Packages/PersonaSSH
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
  configs:
    Debug:
      # The release machine's Swift gives up on expressions that dev machines still type-check (docs/lessons/ios.md); warn early.
      OTHER_SWIFT_FLAGS: "$(inherited) -Xfrontend -warn-long-expression-type-checking=150"
    Release:
      # Anti-tampering basics: no symbols in the shipped binary.
      STRIP_INSTALLED_PRODUCT: YES
      STRIP_STYLE: all
      DEPLOYMENT_POSTPROCESSING: YES
      DEAD_CODE_STRIPPING: YES
      # Field names stay: App Intents finds each @Parameter by its name through reflection. Without them a shortcut's
      # values never reach the intent, and reading a non-optional parameter traps, so the app quits (#990).
      SWIFT_REFLECTION_METADATA_LEVEL: all
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      SWIFT_COMPILATION_MODE: wholemodule
      SWIFT_OPTIMIZATION_LEVEL: -O
targets:
  Persona:
    type: application
    platform: iOS
    sources:
      - path: Persona
        excludes: ["**/*.md"]
      - path: Shared
      - path: LiveActivity
    dependencies:
      - target: PersonaWatch
      - target: PersonaWidgets
      - target: PersonaNotify
      - package: MarkdownUI
      - package: BeautifulUI
      - package: PersonaSSH
    entitlements:
      path: Persona/Resources/Persona.entitlements
      properties:
        aps-environment: development
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        # The app's own group first (stays the default, where the existing items are), then the one the notification
        # service extension shares for the push key (docs/push-relay.md).
        # Last, the one builds 92–103 left the Live Activity's persona in, only so the app can delete what is still
        # there (LiveActivityController.forgetKeychainLook): the extension could never read it on a phone.
        keychain-access-groups: ["$(AppIdentifierPrefix)$(JARVIS_BUNDLE_ID)", "$(AppIdentifierPrefix)$(JARVIS_BUNDLE_ID).push", "$(AppIdentifierPrefix)$(JARVIS_BUNDLE_ID).look"]
        # Shared with the widget extension: the persona the Live Activity draws and a package's pictures, as files
        # (docs/live-activity.md「形象」). group.<bundle id> unless config.json app.app_group says otherwise; registered in
        # the developer account and put on both App IDs (docs/release.md「App Group」).
        com.apple.security.application-groups: ["$(JARVIS_APP_GROUP)"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(JARVIS_BUNDLE_ID)
        PRODUCT_MODULE_NAME: Jarvis
        PRODUCT_NAME: Persona
        # iPhone and iPad (2026-10-31: on iPad it ran as a phone-sized window). Wide layouts come from the size class
        # (SplitNavigation), as on an open iPhone Duo.
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # 设置 › 外观 › App 图标 (AppIconChoice, scripts/assets/make_alt_icons.py); the Mac target shares the catalog but not these.
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-Peach AppIcon-Didot AppIcon-Aura AppIcon-PaperLight AppIcon-PaperDark AppIcon-PeachLight AppIcon-PeachDark"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
        # The commit stamp below reads the repository's .git, which the script sandbox does not let it see.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    # Which commit a build is (设置 › 关于 › 构建): stamped into the built Info.plist on every build, before signing;
    # "+" when the working tree had changes not committed.
    postBuildScripts:
      - name: Stamp the commit
        basedOnDependencyAnalysis: false
        # Its input, so it runs after the Info.plist is written (ran before it once, and the stamp was lost).
        inputFiles: ["$(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)"]
        script: |
          sha=$(git -C "$SRCROOT/.." rev-parse --short=8 HEAD 2>/dev/null || echo unknown)
          git -C "$SRCROOT/.." diff --quiet HEAD -- 2>/dev/null || sha="$sha+"
          plist="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
          /usr/libexec/PlistBuddy -c "Set :JarvisCommit $sha" "$plist" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :JarvisCommit string $sha" "$plist"
    info:
      path: Persona/Resources/Info.plist
      properties:
        CFBundleName: Persona
        CFBundleDisplayName: Persona
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes: [jarvis, persona]
        ITSAppUsesNonExemptEncryption: false
        # The push relay (docs/push-relay.md) and the keychain group of the key pushes are sealed to, like the iPhone's.
        JarvisPushRelay: $(JARVIS_PUSH_RELAY)
        JarvisPushKeychainGroup: $(DEVELOPMENT_TEAM).$(JARVIS_BUNDLE_ID).push
        LSApplicationCategoryType: public.app-category.productivity
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # iPad: every orientation (Split View and Stage Manager need it).
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown,
                                                UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIBackgroundModes: [remote-notification, audio]
        # Push relay (docs/push-relay.md): where the app registers for pushes from hubs without the app's APNs key
        # (config.json app.push_relay; empty: none), and the keychain group it shares with JarvisNotify.
        # The groups' prefix is the team, not $(AppIdentifierPrefix): that one is only set when Xcode signs, and an
        # archive built unsigned for a cloud-signed export left it empty (scripts/release/entitlements.py, 2026-11-02).
        JarvisPushRelay: $(JARVIS_PUSH_RELAY)
        JarvisPushKeychainGroup: $(DEVELOPMENT_TEAM).$(JARVIS_BUNDLE_ID).push
        # Where the app leaves the persona the Live Activity draws for the widget extension (FleetLookStore). An App
        # Group's id has no team prefix: the same in an archive built unsigned.
        JarvisAppGroup: $(JARVIS_APP_GROUP)
        # The Fleet activity on the lock screen / Dynamic Island (docs/live-activity.md).
        NSSupportsLiveActivities: true
        # The hub is usually reached over plain HTTP inside a private network (docs/config.md).
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSCameraUsageDescription: "Persona uses the camera to scan the pairing QR code printed by `personad hub pair`, for example when you first connect to your hub."
        NSFaceIDUsageDescription: "Persona asks for Face ID before it types a Mac's remembered password on that Mac's lock screen, when you tap 一键解锁 on the Mac's page."
        NSContactsUsageDescription: "Persona lets Claude look up your contacts when you ask, for example to find a colleague's phone number or email before drafting a message."
        NSCalendarsFullAccessUsageDescription: "Persona lets Claude read and add calendar events when you ask, for example to check whether you are free on Friday afternoon or to book a meeting."
        NSCalendarsWriteOnlyAccessUsageDescription: "Persona adds events to your calendar when you ask Claude to, for example to save a meeting it scheduled for you."
        NSRemindersFullAccessUsageDescription: "Persona lets Claude read and create reminders when you ask, for example to add “review the PR” to your Today list."
        NSLocationWhenInUseUsageDescription: "Persona shares your current location with Claude only when you ask, for example to find what time it is where you are or which office you are in."
        NSHealthShareUsageDescription: "Persona lets Claude read health summaries when you ask, for example how many steps you walked this week or how long you slept last night."
        # Asked when Claude saves a health sample (phone_health_write_sample); App Store processing also wants it with the HealthKit entitlement.
        NSHealthUpdateUsageDescription: "Persona saves health data only after you approve it on your iPhone, one entry at a time, for example a weight or last night's sleep you told Claude about."
        NSPhotoLibraryUsageDescription: "Persona lets Claude look at recent photos when you ask, for example to read a screenshot you took or describe a whiteboard photo."
        NSPhotoLibraryAddUsageDescription: "Persona saves images Claude produces to your library when you ask, for example a chart it generated."
        NSMicrophoneUsageDescription: "Persona records audio when you start a recording or dictate a message, for example a meeting or a spoken note. Recordings are transcribed on your iPhone before you choose to share the text with your assistant."
        NSSpeechRecognitionUsageDescription: "Persona turns your voice into text when you hold the mic button, for example to dictate a reply to Claude."
  # The native macOS app (docs/mac.md): the iOS app's logic and content views, compiled for macOS, inside a Mac
  # shell (Mac/): windows, sidebar, toolbar, menus, keyboard shortcuts, Settings, the menu bar. iOS-only parts are
  # behind `#if os(iOS)`; Mac/Compat gives the iOS-only modifiers Mac meanings.
  PersonaMac:
    type: application
    platform: macOS
    sources:
      - path: Mac
        excludes: ["**/*.md"]
      - path: Shared
      - path: Persona
        excludes: ["**/*.md", "App/PersonaApp.swift", "App/LiveActivityController.swift", "Resources/Info.plist", "Resources/Persona.entitlements"]
    dependencies:
      - target: PersonaMacNotify
      - package: MarkdownUI
      - package: BeautifulUI
      - package: PersonaSSH
    entitlements:
      path: Mac/Resources/PersonaMac.entitlements
      properties:
        # Remote push (PushRegistrar; macOS's name for iOS's aps-environment). The archive says development; the App
        # Store export signs it production (checked by scripts/release/entitlements.py check on the .pkg).
        com.apple.developer.aps-environment: development
        # The relay's push key, shared with JarvisMacNotify (PushCrypto, in the data protection keychain on a Mac).
        # The app's own group first: it stays the default.
        keychain-access-groups: ["$(AppIdentifierPrefix)$(JARVIS_BUNDLE_ID)", "$(AppIdentifierPrefix)$(JARVIS_BUNDLE_ID).push"]
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        # A machine's port forwarded to this Mac's loopback for the in-app browser (docs/ports.md).
        com.apple.security.network.server: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.personal-information.addressbook: true
        com.apple.security.personal-information.calendars: true
        com.apple.security.personal-information.location: true
        com.apple.security.personal-information.photos-library: true
        com.apple.security.device.audio-input: true
        com.apple.security.device.camera: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(JARVIS_BUNDLE_ID)
        PRODUCT_MODULE_NAME: Jarvis
        PRODUCT_NAME: Persona
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        COMBINE_HIDPI_IMAGES: YES
    postBuildScripts:
      - name: Stamp the commit
        basedOnDependencyAnalysis: false
        inputFiles: ["$(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)"]
        script: |
          sha=$(git -C "$SRCROOT/.." rev-parse --short=8 HEAD 2>/dev/null || echo unknown)
          git -C "$SRCROOT/.." diff --quiet HEAD -- 2>/dev/null || sha="$sha+"
          plist="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
          /usr/libexec/PlistBuddy -c "Set :JarvisCommit $sha" "$plist" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :JarvisCommit string $sha" "$plist"
    info:
      path: Mac/Resources/Info.plist
      properties:
        CFBundleName: Persona
        CFBundleDisplayName: Persona
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes: [jarvis, persona]
        ITSAppUsesNonExemptEncryption: false
        # The push relay (docs/push-relay.md) and the keychain group of the key pushes are sealed to, like the iPhone's.
        JarvisPushRelay: $(JARVIS_PUSH_RELAY)
        JarvisPushKeychainGroup: $(DEVELOPMENT_TEAM).$(JARVIS_BUNDLE_ID).push
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: "26.0"
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSCameraUsageDescription: "Persona uses the camera to scan the pairing QR code printed by `personad hub pair`, for example when you first connect to your hub."
        NSContactsUsageDescription: "Persona lets Claude look up your contacts when you ask, for example to find a colleague's phone number or email before drafting a message."
        NSCalendarsFullAccessUsageDescription: "Persona lets Claude read and add calendar events when you ask, for example to check whether you are free on Friday afternoon or to book a meeting."
        NSCalendarsWriteOnlyAccessUsageDescription: "Persona adds events to your calendar when you ask Claude to, for example to save a meeting it scheduled for you."
        NSRemindersFullAccessUsageDescription: "Persona lets Claude read and create reminders when you ask, for example to add “review the PR” to your Today list."
        NSLocationWhenInUseUsageDescription: "Persona shares your current location with Claude only when you ask, for example to find what time it is where you are or which office you are in."
        NSLocationUsageDescription: "Persona shares your current location with Claude only when you ask, for example to find what time it is where you are or which office you are in."
        NSPhotoLibraryUsageDescription: "Persona lets Claude look at recent photos when you ask, for example to read a screenshot you took or describe a whiteboard photo."
        NSPhotoLibraryAddUsageDescription: "Persona saves images Claude produces to your library when you ask, for example a chart it generated."
        NSMicrophoneUsageDescription: "Persona records audio when you start a recording or dictate a message, for example a meeting or a spoken note. Recordings are transcribed on your iPhone before you choose to share the text with your assistant."
        NSSpeechRecognitionUsageDescription: "Persona turns your voice into text when you hold the mic button, for example to dictate a reply to Claude."
  # The native visionOS app (docs/vision.md): the iOS app's logic and content views, compiled for visionOS (UIKit, so
  # most of it as is), inside a visionOS shell (Vision/): an ornament for the tabs, a window per conversation, the
  # 需要你 ornament. iPhone-only parts (Live Activity, the watch, haptics) are behind `#if os(iOS)` / `os(visionOS)`.
  PersonaVision:
    type: application
    platform: visionOS
    sources:
      - path: Vision
        excludes: ["**/*.md"]
      - path: Shared
      - path: Persona
        excludes: ["**/*.md", "Resources/Info.plist", "Resources/Persona.entitlements"]
      # The persona's pictures as the Live Activity keeps them (FleetFaces, FleetLookStore): AppModel reads them.
      - path: LiveActivity/FleetPersona.swift
      - path: LiveActivity/FleetIslandViews.swift
    dependencies:
      - package: MarkdownUI
      - package: BeautifulUI
      - package: PersonaSSH
    entitlements:
      path: Vision/Resources/PersonaVision.entitlements
      properties:
        aps-environment: development
        keychain-access-groups: ["$(AppIdentifierPrefix)$(JARVIS_BUNDLE_ID)", "$(AppIdentifierPrefix)$(JARVIS_BUNDLE_ID).push"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(JARVIS_BUNDLE_ID)
        PRODUCT_MODULE_NAME: Jarvis
        PRODUCT_NAME: Persona
        TARGETED_DEVICE_FAMILY: "7"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      - name: Stamp the commit
        basedOnDependencyAnalysis: false
        inputFiles: ["$(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)"]
        script: |
          sha=$(git -C "$SRCROOT/.." rev-parse --short=8 HEAD 2>/dev/null || echo unknown)
          git -C "$SRCROOT/.." diff --quiet HEAD -- 2>/dev/null || sha="$sha+"
          plist="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
          /usr/libexec/PlistBuddy -c "Set :JarvisCommit $sha" "$plist" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :JarvisCommit string $sha" "$plist"
    info:
      path: Vision/Resources/Info.plist
      properties:
        CFBundleName: Persona
        CFBundleDisplayName: Persona
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes: [jarvis, persona]
        ITSAppUsesNonExemptEncryption: false
        JarvisPushRelay: $(JARVIS_PUSH_RELAY)
        JarvisPushKeychainGroup: $(DEVELOPMENT_TEAM).$(JARVIS_BUNDLE_ID).push
        LSApplicationCategoryType: public.app-category.productivity
        UIApplicationSupportsIndirectInputEvents: true
        # Several windows: one per conversation opened on its own (VisionScenes).
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UIApplicationPreferredDefaultSceneSessionRole: UIWindowSceneSessionRoleApplication
        UIBackgroundModes: [remote-notification, audio]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSCameraUsageDescription: "Persona uses the camera to scan the pairing QR code printed by `personad hub pair`, for example when you first connect to your hub."
        NSFaceIDUsageDescription: "Persona asks for Optic ID before it types a Mac's remembered password on that Mac's lock screen, when you tap 一键解锁 on the Mac's page."
        NSContactsUsageDescription: "Persona lets Claude look up your contacts when you ask, for example to find a colleague's phone number or email before drafting a message."
        NSCalendarsFullAccessUsageDescription: "Persona lets Claude read and add calendar events when you ask, for example to check whether you are free on Friday afternoon or to book a meeting."
        NSCalendarsWriteOnlyAccessUsageDescription: "Persona adds events to your calendar when you ask Claude to, for example to save a meeting it scheduled for you."
        NSRemindersFullAccessUsageDescription: "Persona lets Claude read and create reminders when you ask, for example to add “review the PR” to your Today list."
        NSLocationWhenInUseUsageDescription: "Persona shares your current location with Claude only when you ask, for example to find what time it is where you are or which office you are in."
        NSPhotoLibraryUsageDescription: "Persona lets Claude look at recent photos when you ask, for example to read a screenshot you took or describe a whiteboard photo."
        NSPhotoLibraryAddUsageDescription: "Persona saves images Claude produces to your library when you ask, for example a chart it generated."
        NSMicrophoneUsageDescription: "Persona records audio when you start a recording or dictate a message, for example a meeting or a spoken note. Recordings are transcribed on your device before you choose to share the text with your assistant."
        NSSpeechRecognitionUsageDescription: "Persona turns your voice into text when you hold the mic button, for example to dictate a reply to Claude."
  # Draws the Fleet Live Activity. The app starts it and reports its tokens; the hub pushes its content.
  PersonaWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: PersonaWidgets
      - path: LiveActivity
      - path: Shared/FleetState.swift
      - path: Shared/StatusPalette.swift
      - path: Shared/Design/Palette.swift
      - path: Shared/Design/IslandMetrics.swift
      # The persona's face (the app's JarvisAvatar draws it too), on the activity's leading side.
      - path: Shared/Design/PersonaFace.swift
    entitlements:
      path: PersonaWidgets/PersonaWidgets.entitlements
      properties:
        # Not the keychain: a Live Activity's extension cannot read it on a phone (build 103, 2026-11-02).
        com.apple.security.application-groups: ["$(JARVIS_APP_GROUP)"]
    info:
      path: PersonaWidgets/Info.plist
      properties:
        CFBundleName: PersonaWidgets
        JarvisAppGroup: $(JARVIS_APP_GROUP)
        CFBundleDisplayName: Persona
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: zh-Hans
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(JARVIS_BUNDLE_ID).liveactivity
        PRODUCT_MODULE_NAME: JarvisWidgets
        PRODUCT_NAME: PersonaWidgets
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        # Code shared with the app that must not call into it (the intents run in the app process).
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WIDGET_EXTENSION"
  # Opens pushes that came through the relay (docs/push-relay.md): decrypts the sealed payload before it is shown.
  PersonaNotify:
    type: app-extension
    platform: iOS
    sources:
      - path: PersonaNotify
        excludes: ["*.plist", "*.entitlements"]
      - path: Shared/PushCrypto.swift
    entitlements:
      path: PersonaNotify/PersonaNotify.entitlements
      properties:
        keychain-access-groups: ["$(AppIdentifierPrefix)$(JARVIS_BUNDLE_ID).push"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(JARVIS_BUNDLE_ID).notify
        PRODUCT_MODULE_NAME: JarvisNotify
        PRODUCT_NAME: PersonaNotify
        INFOPLIST_FILE: PersonaNotify/Info.plist
        # The system calls the extension on its own queue; the project's MainActor default does not fit its base class.
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
  # The Mac's JarvisNotify (#432): opens pushes that came through the relay before they are shown. Same code, Info.plist
  # and bundle id as the iPhone's (one UNIVERSAL App ID); a Mac extension must be sandboxed.
  PersonaMacNotify:
    type: app-extension
    platform: macOS
    sources:
      - path: PersonaNotify
        excludes: ["*.plist", "*.entitlements"]
      - path: Shared/PushCrypto.swift
    entitlements:
      path: PersonaNotify/PersonaMacNotify.entitlements
      properties:
        com.apple.security.app-sandbox: true
        keychain-access-groups: ["$(AppIdentifierPrefix)$(JARVIS_BUNDLE_ID).push"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(JARVIS_BUNDLE_ID).notify
        PRODUCT_MODULE_NAME: JarvisNotify
        PRODUCT_NAME: PersonaNotify
        INFOPLIST_FILE: PersonaNotify/Info.plist
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        ENABLE_HARDENED_RUNTIME: YES
  PersonaWatch:
    type: application
    platform: watchOS
    sources:
      - path: PersonaWatch
      - path: Shared
    info:
      path: PersonaWatch/Info.plist
      properties:
        CFBundleName: Persona
        CFBundleDisplayName: Persona
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: zh-Hans
        WKApplication: true
        WKCompanionAppBundleIdentifier: $(JARVIS_BUNDLE_ID)
        UIBackgroundModes: [audio]
        NSMicrophoneUsageDescription: "Persona records audio you start on Apple Watch, for example a meeting or a spoken note, then transfers it to your iPhone for on-device transcription before you choose to share the text with your assistant."
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(JARVIS_BUNDLE_ID).watchkitapp
        PRODUCT_MODULE_NAME: Jarvis
        PRODUCT_NAME: Persona
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
  PersonaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PersonaTests
        excludes: ["*.json"] # TokenBaseline.json is read from the source tree, not the bundle
    dependencies:
      - target: Persona
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(JARVIS_BUNDLE_ID).tests
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Persona.app/Persona"
        BUNDLE_LOADER: "$(TEST_HOST)"
  # The Mac shell's own logic (Mac/): menu bar, notifications, quick open… Hosted in the Mac app.
  PersonaMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: PersonaMacTests
      # Shared logic the Mac runs as is: the same tests, run against the Mac build (docs/mac.md 验收清单).
      - path: PersonaTests/HeadingMenuTests.swift
      - path: PersonaTests/IntentsTests.swift
      - path: PersonaTests/KnowledgeTests.swift
      - path: PersonaTests/MachineMetricsTests.swift
      - path: PersonaTests/NotificationActionsTests.swift
      - path: PersonaTests/NotifyPrefsTests.swift
      - path: PersonaTests/PushCryptoTests.swift
    dependencies:
      - target: PersonaMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(JARVIS_BUNDLE_ID).mactests
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Persona.app/Contents/MacOS/Persona"
        BUNDLE_LOADER: "$(TEST_HOST)"
  # UI tests drive the real app in the simulator against the configured hub (scripts/app/ui-test.sh); not in the
  # default test run, which must work offline.
  PersonaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PersonaUITests
    dependencies:
      - target: Persona
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(JARVIS_BUNDLE_ID).uitests
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Persona
schemes:
  Persona:
    build:
      targets:
        Persona: all
        PersonaTests: [test]
        PersonaUITests: [test]
    run:
      config: Debug
    test:
      targets: [PersonaTests, PersonaUITests]
  PersonaWatch:
    build:
      targets:
        PersonaWatch: all
    run:
      config: Debug
  PersonaMac:
    build:
      targets:
        PersonaMac: all
        PersonaMacTests: [test]
    run:
      config: Debug
    test:
      targets: [PersonaMacTests]
  PersonaVision:
    build:
      targets:
        PersonaVision: all
    run:
      config: Debug
  # Legacy scheme names keep existing callers on the renamed targets.
  Jarvis:
    build:
      targets:
        Persona: all
        PersonaTests: [test]
        PersonaUITests: [test]
    run:
      config: Debug
    test:
      targets: [PersonaTests, PersonaUITests]
  JarvisWatch:
    build:
      targets:
        PersonaWatch: all
    run:
      config: Debug
  JarvisMac:
    build:
      targets:
        PersonaMac: all
        PersonaMacTests: [test]
    run:
      config: Debug
    test:
      targets: [PersonaMacTests]

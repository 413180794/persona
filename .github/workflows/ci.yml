name: CI
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: privacy-workflow-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: Privacy and workflow checks
    runs-on: ${{ github.repository_owner == 'nwverse' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Privacy check
        run: python3 scripts/privacy_check.py
      - name: No references into external service repositories
        run: python3 -B scripts/test/test_external_service_refs.py
      - name: Issue-link workflow tests
        run: node scripts/test/pr_needs_issue_test.mjs
      - name: Android translations (docs/i18n.md)
        run: |
          (cd scripts/app && python3 test_android_i18n_check.py)
          python3 scripts/app/android_i18n_check.py
  extension-schema:
    # schema/extension is the one truth of the extension protocol and views: the generated Go / TS / Swift / Kotlin
    # types match it and the examples hold to it (#1849).
    name: Extension schema
    runs-on: ${{ github.repository_owner == 'nwverse' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: sdk/go/go.mod
      - name: Generated types and examples
        run: python3 scripts/test/test_extension_schema.py
      - name: The SDK bundle personad writes new extensions from
        run: python3 scripts/test/test_sdk_bundle.py
      - name: Go wire types round-trip the examples
        working-directory: sdk/go
        run: go test ./...
  windows-build:
    # The server is built and tested on macOS and Linux; nothing else notices when a change breaks the Windows node
    # (docs/windows.md). Cross-compiled here: vet type-checks the tests too.
    name: Server builds for Windows
    runs-on: ${{ github.repository_owner == 'nwverse' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: GOOS=windows build and vet
        working-directory: server
        env:
          GOOS: windows
          GOARCH: amd64
        run: |
          go build ./...
          go vet ./...
  web-test:
    # The web package's vitest suite (docs/testing.md). The privacy job never ran it, so a broken test or a Node
    # version mismatch (#2745) reached master unnoticed. web/.nvmrc is the version both CI and local nvm use.
    name: Web tests
    runs-on: ${{ github.repository_owner == 'nwverse' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test

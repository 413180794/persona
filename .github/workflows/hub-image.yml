# The hub's container image (docs/docker.md, Dockerfile): linux/amd64 + linux/arm64 to ghcr.io/<owner>/<repo>.
#   a tag v*          -> :<version> (v stripped), and :latest unless it is a pre-release (v1.3.0-rc1)
#   run by hand       -> :edge and :sha-<commit>
#   a pull request    -> built and smoke-tested with compose, not pushed
# Every run smoke-tests the image first (amd64, with compose); nothing is pushed unless that passed.
name: hub image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - deploy/docker/**
      - server/**
      - web/**
      - integrations/**
      - spec/fixtures/injected/**
      - .github/workflows/hub-image.yml

permissions:
  contents: read

concurrency:
  group: hub-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ${{ github.repository_owner == 'nwverse' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_DOCKER_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
      image: ${{ steps.version.outputs.image }}
    steps:
      - name: Isolate Docker client state
        shell: bash
        run: |
          config="${RUNNER_TEMP}/docker-${GITHUB_JOB}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          install -d -m 0700 "$config"
          echo "DOCKER_CONFIG=$config" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v="$(git describe --always)-$(date -u +%Y%m%d%H%M)"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # The image's web build skips this (no scripts/ or git in its build context): it runs here, on the checkout.
      - name: Privacy check
        run: python3 scripts/privacy_check.py

      - uses: docker/setup-buildx-action@v3

      - name: Build (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: jarvis-hub:ci
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            IMAGE=${{ steps.version.outputs.image }}
          cache-from: type=gha,scope=hub
          cache-to: type=gha,scope=hub,mode=max,timeout=2m,ignore-error=true

      - name: Prepare isolated Compose fixture
        shell: bash
        run: |
          fixture="${RUNNER_TEMP}/persona-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test ! -e "$fixture"
          install -d -m 0700 "$fixture"
          cp deploy/docker/compose.yaml "$fixture/compose.yaml"
          echo "PERSONA_CI_COMPOSE_DIR=$fixture" >> "$GITHUB_ENV"
          echo "COMPOSE_PROJECT_NAME=persona-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
          port="$(python3 -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1]); s.close()')"
          echo "PERSONA_CI_PORT=$port" >> "$GITHUB_ENV"

      - name: Smoke test with compose
        run: |
          docker run --rm jarvis-hub:ci version | grep -qx '${{ steps.version.outputs.version }}'
          cd "$PERSONA_CI_COMPOSE_DIR"
          smoke_url="http://127.0.0.1:${PERSONA_CI_PORT}"
          printf 'JARVIS_IMAGE=jarvis-hub:ci\nJARVIS_PORT=127.0.0.1:%s\nJARVIS_PUBLIC_URL=http://127.0.0.1:%s\nJARVIS_DB_PASSWORD=%s\nPUID=%s\nPGID=%s\n' \
            "$PERSONA_CI_PORT" "$PERSONA_CI_PORT" "$(openssl rand -hex 24)" "$(id -u)" "$(id -g)" > .env
          docker compose up -d
          ok=
          for _ in $(seq 1 60); do
            if curl -fsS "${smoke_url}/api/v1/health"; then ok=1; break; fi
            sleep 2
          done
          docker compose logs hub | tail -40
          [ -n "$ok" ] || { echo "the hub never answered /api/v1/health"; exit 1; }
          pair_output="$(docker compose exec -T hub jarvisd hub pair)"
          printf '%s\n' "$pair_output" | grep -q 'jarvis://pair?'
          key_output="$(docker compose exec -T hub jarvisd hub tailcat-key)"
          printf '%s\n' "$key_output" | grep -q '^nodekey:'
          curl -fsS "${smoke_url}/" | grep -qi '<html'
          # The admin UI (docs/admin.md): there inside the container (loopback); from the runner through the port
          # mapping the container sees the bridge's gateway, which is never LAN, so it is not there.
          docker compose exec -T hub wget -qO- http://127.0.0.1:18660/admin | grep -q 'Persona 管理'
          docker compose exec -T hub wget -qO- http://127.0.0.1:18660/api/v1/admin/state | grep -q '"password_set":false'
          if curl -fsS "${smoke_url}/admin" | grep -q 'Persona 管理'; then
            echo "admin UI is exposed through the mapped port"
            exit 1
          fi
          [ "$(curl -s -o /dev/null -w '%{http_code}' "${smoke_url}/api/v1/admin/state")" = "$(curl -s -o /dev/null -w '%{http_code}' "${smoke_url}/api/v1/machines")" ]
          if docker info --format '{{json .SecurityOptions}}' | grep -q 'name=rootless'; then
            mapped_uid="$(docker run --rm --entrypoint awk jarvis-hub:ci -v uid="$(id -u)" '$1 <= uid && uid < $1 + $3 { print $2 + uid - $1 }' /proc/self/uid_map)"
            [ -n "$mapped_uid" ] && [ "$(stat -c %u data)" = "$mapped_uid" ] || { echo "data directory has the wrong mapped PUID"; exit 1; }
            [ "$(docker compose exec -T --user 0 hub stat -c %u /home/jarvis/.jarvis/hub.json)" = "$(id -u)" ] || { echo "hub.json is not owned by PUID"; exit 1; }
            [ "$(docker compose exec -T --user 0 hub stat -c %a /home/jarvis/.jarvis/hub.json)" = 600 ] || { echo "hub.json is not 0600"; exit 1; }
          else
            [ "$(stat -c %u data/hub.json)" = "$(id -u)" ] || { echo "hub.json is not owned by PUID"; exit 1; }
            [ "$(stat -c %a data/hub.json)" = 600 ] || { echo "hub.json is not 0600"; exit 1; }
          fi

      - name: Remove isolated Compose fixture
        if: always() && env.PERSONA_CI_COMPOSE_DIR != ''
        shell: bash
        run: |
          set -euo pipefail
          cd "$PERSONA_CI_COMPOSE_DIR"
          if [ -f .env ]; then
            docker compose down --volumes --remove-orphans
          fi
          docker run --rm --user 0 --entrypoint sh \
            --mount "type=bind,src=${PERSONA_CI_COMPOSE_DIR},dst=/fixture" \
            jarvis-hub:ci -c 'rm -rf /fixture/data /fixture/postgres'

  publish:
    needs: smoke
    if: github.event_name != 'pull_request'
    runs-on: ${{ github.repository_owner == 'nwverse' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_DOCKER_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Isolate Docker client state
        shell: bash
        run: |
          config="${RUNNER_TEMP}/docker-${GITHUB_JOB}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          install -d -m 0700 "$config"
          echo "DOCKER_CONFIG=$config" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4

      - if: runner.environment == 'github-hosted'
        uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ needs.smoke.outputs.image }}
          flavor: latest=false
          tags: |
            type=match,pattern=v(.*),group=1
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' }}
            type=sha,enable=${{ github.event_name == 'workflow_dispatch' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ needs.smoke.outputs.version }}
            IMAGE=${{ needs.smoke.outputs.image }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=hub
          cache-to: type=gha,scope=hub,mode=max,timeout=2m,ignore-error=true

name: Server CI
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  server:
    name: Server lint, tests and builds
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: |
            server/go.sum
            sdk/go/go.sum
      - name: Server checks
        run: scripts/ci/server.sh
